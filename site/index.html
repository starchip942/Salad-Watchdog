<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>GPU Watchdog</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233fd6ff'/%3E%3Cstop offset='.5' stop-color='%2344e08a'/%3E%3Cstop offset='1' stop-color='%23ffb547'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Crect x='8' y='8' width='16' height='16' rx='5' fill='%2307090c'/%3E%3C/svg%3E">
<link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
<header class="top">
  <div class="brand"><b></b><span>GPU WATCHDOG</span></div>
  <button class="btn ghost logs-btn" id="log-more">Logs</button>
</header>

<div id="banners"></div>

<section class="hero" id="hero">
  <canvas id="hero-canvas" aria-label="Your MSI RTX 5070 Ti, with fans turning at the real fan speed"></canvas>
  <div class="hero-read">
    <div class="lbl" id="gpu-name">RTX 5070 Ti</div>
    <div class="big num" id="gpu-temp">--<sup>°C</sup></div>
    <div class="mrow num">
      <div><div class="lbl">Load</div><div class="v" id="gpu-util">--</div></div>
      <div><div class="lbl">Power</div><div class="v" id="gpu-power">--</div></div>
      <div><div class="lbl">Fans</div><div class="v" id="gpu-fans">--</div></div>
    </div>
  </div>
</section>

<main class="main">
  <div class="tiles4">
    <div class="glass tile"><div class="lbl">Core</div><div class="v num" id="t-core">--</div></div>
    <div class="glass tile"><div class="lbl">Hot Spot</div><div class="v num" id="t-hot">--</div></div>
    <div class="glass tile"><div class="lbl">VRAM</div><div class="v num" id="t-vram">--</div><div class="bar"><i id="t-vram-bar"></i></div></div>
    <div class="glass tile"><div class="lbl">Power</div><div class="v num" id="t-power">--</div></div>
  </div>

  <div class="row r1">
    <section class="glass card" id="salad-card">
      <div class="sec-h"><h2>Salad</h2></div>
      <div class="srow">
        <div><div class="state" id="salad-state">--</div></div>
      </div>
      <div id="earn">
        <div class="lbl" style="margin-top:20px">Salad Balance</div>
        <div class="bal num" id="e-bal">--</div>
        <div class="kv2 num">
          <div><div class="lbl">Last 24 hours</div><div class="v" id="e-24">--</div></div>
          <div><div class="lbl">Last payout</div><div class="v" id="e-pay">--</div></div>
          <div><div class="lbl">Est. next hour</div><div class="v" id="e-next">--</div></div>
        </div>
      </div>
    </section>

    <section class="glass card core-card">
      <div class="sec-h"><h2>Core die</h2></div>
      <div class="corewrap" id="corewrap">
        <img id="core-img" alt="GPU package with the die in the middle" src="">
        <div class="dieglow"></div>
        <svg aria-hidden="true"></svg>
        <div class="co co-core"><div class="lbl">Core</div><div class="t num" id="c-core">--</div></div>
        <div class="co co-hot"><div class="lbl">Hot Spot</div><div class="t num" id="c-hot">--</div></div>
      </div>
    </section>
  </div>

  <div class="row r2">
    <section class="glass card"><div class="sec-h"><h2>CPU</h2><span id="cpu-name"></span></div>
      <div class="two num">
        <div><div class="lbl">Temperature</div><div class="v" id="cpu-temp">--</div></div>
        <div><div class="lbl">Power Draw</div><div class="v" id="cpu-power">--</div></div>
      </div></section>
    <section class="glass card"><div class="sec-h"><h2>Memory</h2></div>
      <div class="two num" id="ram"></div></section>
    <section class="glass card"><div class="sec-h"><h2>Storage</h2></div>
      <div class="two num" id="ssd"></div></section>
  </div>

  <div class="row r3">
    <section class="glass card" id="controls">
      <div class="sec-h"><h2>Controls</h2><span id="lock-state"></span></div>
      <form class="lockbar" id="lockbar" autocomplete="off">
        <input id="pw" type="password" inputmode="numeric" placeholder="Password" aria-label="Password" autocomplete="current-password">
        <button class="btn go" type="submit">Unlock</button>
      </form>
      <div class="msg" id="ctl-msg" role="status"></div>
      <div class="ctrls">
        <button class="btn go" data-cmd="salad_chop_now">▶ Chop Now</button>
        <button class="btn" data-cmd="salad_pause">❚❚ Pause</button>
        <button class="btn" data-cmd="salad_off_now">✕ Close Salad</button>
        <button class="btn" data-cmd="schedule" id="btn-sched">⏱ Schedule off</button>
        <button class="btn ab" data-ab="1">Undervolt</button>
        <button class="btn ab" data-ab="2">Stock</button>
        <button class="btn danger" data-cmd="pc_off_now">⏻ PC off now</button>
      </div>
      <div class="sched" id="sched-list"></div>
    </section>
  </div>
  <footer id="foot"></footer>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <div class="panel glass" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-h"><h3 id="sheet-title"></h3><button class="x" data-close aria-label="Close">✕</button></div>
    <div id="sheet-body"></div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
